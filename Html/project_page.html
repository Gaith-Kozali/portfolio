<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="../icons/portfolio.png">
  <link rel="stylesheet" href="../Css/base.css">
  <link rel="stylesheet" href="../Css/project_page.css">
  <title>Project Details</title>
</head>
<body>
  <main class="container" role="main">
    <section class="project-main" aria-labelledby="projectTitle">
      <div class="breadcrumb"><a href="index.html" style="color:inherit;text-decoration:none;opacity:0.95">← Back to projects</a></div>
      <h1 id="projectTitle" class="project-title">Loading...</h1>
      <div id="projectSummary" class="project-summary"> </div>

      <div class="gallery" aria-hidden="false">
        <div class="main-img" id="mainImage">
        </div>
        <div class="thumbs" id="thumbs">
        </div>
      </div>

      <div class="description" id="projectDescription">
      </div>
    </section>

    <aside class="sidebar" aria-labelledby="sidebarTitle">
      <div class="card">
        <div class="meta-title">Project Info</div>
        <div class="meta-label">Technologies</div>
        <div id="techTags" class="tags"></div>
      </div>

      <div class="card">
        <div class="meta-title">Project Links</div>
        <div class="actions">
          <a id="liveBtn" class="btn btn-primary" href="#" target="_blank" rel="noopener">Demo</a>
          <a id="codeBtn" class="btn btn-secondary" href="#" target="_blank" rel="noopener">Source Code</a>
        </div>
      </div>

      <div class="card">
        <div class="meta-title">Project Details</div>
        <div class="meta-label" id="projectType">Type</div>
      </div>
    </aside>
  </main>
<script type="module" src="../javaScript/project_page.js"></script>

</body>
</html>
